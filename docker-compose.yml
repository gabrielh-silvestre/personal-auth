services:
  backend:
    build:
      context: .
      dockerfile: .docker/Dockerfile.dev
    command: npm run start:dev:obs
    restart: on-failure
    mem_limit: 768m
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - ${PORT}:${PORT}
      - 50051:50051
    tty: true
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - NODE_OPTIONS=--max-old-space-size=600
      - PORT=${PORT}
      - GRPC_URL=backend:50051

      - MONGO_URI=mongodb://mongo:27017/${DB_NAME}

      - JWT_ACCESS_TOKEN_SECRET=${JWT_ACCESS_TOKEN_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRES_IN=${JWT_ACCESS_TOKEN_EXPIRES_IN}

      - JWT_REFRESH_TOKEN_SECRET=${JWT_REFRESH_TOKEN_SECRET}
      - JWT_REFRESH_TOKEN_EXPIRES_IN=${JWT_REFRESH_TOKEN_EXPIRES_IN}

      - OTEL_ENABLED=${OTEL_ENABLED:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-personal-auth}
      - OTEL_SERVICE_VERSION=${OTEL_SERVICE_VERSION:-0.0.0}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - OTEL_EXPORTER_OTLP_LOGS_ENDPOINT=${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT:-http://jaeger:4318/v1/logs}
      - OTEL_TRACES_SAMPLER=${OTEL_TRACES_SAMPLER:-parentbased_always_on}
      - OTEL_TRACES_SAMPLER_ARG=${OTEL_TRACES_SAMPLER_ARG:-}
      - OTEL_LOG_LEVEL=${OTEL_LOG_LEVEL:-info}
      - OTEL_METRIC_EXPORT_INTERVAL_MS=${OTEL_METRIC_EXPORT_INTERVAL_MS:-60000}
      - OTEL_RESOURCE_ATTRIBUTES=${OTEL_RESOURCE_ATTRIBUTES:-deployment.environment=local}
      - OTEL_NODE_DISABLED_INSTRUMENTATIONS=${OTEL_NODE_DISABLED_INSTRUMENTATIONS:-}

      - RABBITMQ_ENABLED=${RABBITMQ_ENABLED:-false}
      - RABBITMQ_PORT=${RABBITMQ_PORT}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASS=${RABBITMQ_PASS}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:${RABBITMQ_PORT}
    networks:
      - personal-network

  mongo:
    image: mongo:7.0
    restart: always
    mem_limit: 256m
    ports:
      - ${MONGO_PORT}:27017
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27017 --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    cap_add:
      - SYS_NICE
    networks:
      - personal-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    mem_limit: 256m
    ports:
      - ${RABBITMQ_PORT}:5672
      - ${RABBITMQ_MANAGEMENT_PORT}:15672
    environment:
      - AMQP_URL=amqp://rabbitmq?connection_attempts=5&retry_delay=5
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS}
      - RABBITMQ_ERLANG_COOKIE=SQOKODSQALRPCLNMEQG
      - RABBITMQ_DEFAULT_VHOST=/
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - personal-network

  jaeger:
    image: jaegertracing/all-in-one:1.57
    mem_limit: 256m
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - personal-network

networks:
  personal-network:
    driver: bridge

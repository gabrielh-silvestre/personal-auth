on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

jobs:
  Coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Verify git repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install node on version
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests and generate coverage
        run: npm run test:cov

      - name: Build and boot smoke
        run: |
          npm run build
          test -f dist/main.js
          NODE_ENV=test \
          PORT=3000 \
          GRPC_URL=localhost:50051 \
          MONGO_URI=mongodb://localhost:27017/smoke \
          RABBITMQ_URL=amqp://localhost:5672 \
          RABBITMQ_AUTH_QUEUE=auth \
          RABBITMQ_USER_QUEUE=user \
          RABBITMQ_MAIL_QUEUE=mail \
          timeout 30 node dist/main.js > boot.log 2>&1 || true
          cat boot.log
          grep -q "Starting Nest application" boot.log
          ! grep -qE "MODULE_NOT_FOUND|Cannot find module|Missing required environment variable" boot.log

      # SonarCloud Scan: desabilitado até o SONAR_TOKEN ser rotacionado (403).
